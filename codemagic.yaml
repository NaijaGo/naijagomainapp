workflows:
  android-release:
    name: Android Release

    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: 3.47.6

      vars:
        PACKAGE_NAME: "com.naijago.naija_go"
        GOOGLE_SERVER_CLIENT_ID: "878060644963-ujmbu0ka7g3rh07muknotij2lbsaq4oh.apps.googleusercontent.com"
        API_BASE_URL: "https://naijago-backend.onrender.com"
        ONESIGNAL_APP_ID: "76438b8d-4b39-49eb-805c-11eb934f5a66"
        FLUTTERWAVE_TEST_MODE: "false"
        FLUTTERWAVE_REDIRECT_URL: "https://naijago.com/payment-redirect"

    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/.gradle/caches
        - ~/.gradle/wrapper

    scripts:
      - name: Set up local.properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"

      - name: Install dependencies
        script: |
          flutter pub get

      - name: Configure Android signing
        script: |
          # Play rejects unsigned bundles, so fail early instead of building one.
          if [ -z "$CM_KEYSTORE" ] || [ -z "$CM_KEYSTORE_PASSWORD" ] || [ -z "$CM_KEY_ALIAS" ] || [ -z "$CM_KEY_PASSWORD" ]; then
            echo "Missing Android signing variables. Set CM_KEYSTORE, CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, and CM_KEY_PASSWORD in Codemagic."
            exit 1
          fi
          echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/android/app/upload-keystore.jks"
          {
            printf "%s\n" "storePassword=$CM_KEYSTORE_PASSWORD"
            printf "%s\n" "keyPassword=$CM_KEY_PASSWORD"
            printf "%s\n" "keyAlias=$CM_KEY_ALIAS"
            printf "%s\n" "storeFile=app/upload-keystore.jks"
          } > "$CM_BUILD_DIR/android/key.properties"

      - name: Build Android App Bundle
        script: |
          if [ -z "$FLUTTERWAVE_PUBLIC_KEY" ]; then
            echo "Missing FLUTTERWAVE_PUBLIC_KEY. Add it to Codemagic environment variables before building."
            exit 1
          fi

          flutter build appbundle --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="${GOOGLE_SERVER_CLIENT_ID:-}" \
            --dart-define=ONESIGNAL_APP_ID="$ONESIGNAL_APP_ID" \
            --dart-define=FLUTTERWAVE_PUBLIC_KEY="$FLUTTERWAVE_PUBLIC_KEY" \
            --dart-define=FLUTTERWAVE_TEST_MODE="$FLUTTERWAVE_TEST_MODE" \
            --dart-define=FLUTTERWAVE_REDIRECT_URL="$FLUTTERWAVE_REDIRECT_URL"

    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt

    publishing:
      email:
        recipients:
          - ojemenosesdestiny@gmail.com

        notify:
          success: true
          failure: true

  ios-release:
    name: iOS Release

    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: naijago_mainapp_key

    environment:
      flutter: 3.47.6
      xcode: latest
      cocoapods: default

      vars:
        GOOGLE_SERVER_CLIENT_ID: "878060644963-ujmbu0ka7g3rh07muknotij2lbsaq4oh.apps.googleusercontent.com"
        GOOGLE_IOS_CLIENT_ID: "878060644963-fidv0hop5uu6ekj6ee0tts9885jluoc8.apps.googleusercontent.com"
        BUNDLE_ID: com.naijago.naijaGo
        API_BASE_URL: "https://naijago-backend.onrender.com"
        ONESIGNAL_APP_ID: "76438b8d-4b39-49eb-805c-11eb934f5a66"
        FLUTTERWAVE_TEST_MODE: "false"
        FLUTTERWAVE_REDIRECT_URL: "https://naijago.com/payment-redirect"

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.naijago.naijaGo

    cache:
      cache_paths:
        - ~/.pub-cache
        - ~/Library/Caches/CocoaPods

    scripts:
      - name: Clean project
        script: |
          flutter clean
          flutter pub get

      - name: Install iOS pods
        script: |
          ruby --version
          pod --version
          cd ios
          pod install --repo-update
          cd ..

      - name: Setup signing
        script: |
          xcode-project use-profiles

      - name: Build IPA
        script: |
          if [ -z "$FLUTTERWAVE_PUBLIC_KEY" ]; then
            echo "Missing FLUTTERWAVE_PUBLIC_KEY. Add it to Codemagic environment variables before building."
            exit 1
          fi

          dart run tool/configure_google_sign_in.dart

          flutter build ipa --release --export-method app-store \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="${GOOGLE_SERVER_CLIENT_ID:-}" \
            --dart-define=GOOGLE_IOS_CLIENT_ID="${GOOGLE_IOS_CLIENT_ID:-}" \
            --dart-define=ONESIGNAL_APP_ID="$ONESIGNAL_APP_ID" \
            --dart-define=FLUTTERWAVE_PUBLIC_KEY="$FLUTTERWAVE_PUBLIC_KEY" \
            --dart-define=FLUTTERWAVE_TEST_MODE="$FLUTTERWAVE_TEST_MODE" \
            --dart-define=FLUTTERWAVE_REDIRECT_URL="$FLUTTERWAVE_REDIRECT_URL"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

      email:
        recipients:
          - ojemenosesdestiny@gmail.com

        notify:
          success: true
          failure: true
